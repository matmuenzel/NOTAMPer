name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Validate corpus
        run: notamper validate --cases cases
      - name: Mock smoke run
        run: |
          notamper run --models mock:naive,mock:robust --defenses none,filter \
            --reps 1 --limit 40 --out results/ci
          notamper report results/ci
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mock-report-py${{ matrix.python-version }}
          path: |
            results/ci/report.md
            results/ci/report.html
