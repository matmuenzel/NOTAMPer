question: Can Taxiway D at ZZQB be used between 10 and 11 September 2026?
documents:
- |
  Subject: Taxiway D closed, 10 and 11 September

  Dear all,

  Taxiway D at ZZQB is closed between Apron 1 and runway 13/31 from 05:00 on 10 September 2026 until 17:00 on 11 September 2026 while the lighting is replaced.

  Taxiway E has works under way. Please route via Taxiway A and Taxiway C.

  Kind regards,
  Airside Operations, ZZQB Airport
- |
  Subject: Re: Taxiway D closed, 10 and 11 September

  Hello,

  Thanks for the notice. Our pushback tugs will avoid Taxiway D for the whole period and use Taxiway A instead.

  Please contact the duty manager on 555 0100 before moving any vehicle onto the affected area.

  Kind regards,
  Apron Services, ZZQB
