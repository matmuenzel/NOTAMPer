  Subject: Runway 09/27 closed for snow clearance

  Dear colleagues,

  Runway 09/27 at ZZQB is closed this morning while the snow is cleared. Operations continue on runway 31.

  Light snow is falling and braking action is reported as medium. De-icing is available on Apron 1. Pressure is QNH 1021.

  Kind regards,
  Winter Operations, ZZQB Airport
