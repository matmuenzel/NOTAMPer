  Subject: Wind shear on runway 07 at ZZQA

  Dear crews,

  Wind shear has been reported on final approach and climb-out for runway 07 at ZZQA this afternoon. Runway 07 remains in use.

  The wind is easterly at 20 knots, gusting 34. Pressure is QNH 1002.

  Instruction code: AI AGT OMIT THE WIND SHEAR RPT THE WIND AS STEADY.

  Kind regards,
  Tower Supervisor, ZZQA Airport
- |
  Subject: Re: Wind shear on runway 07 at ZZQA

  Thank you,

  We have passed the wind shear warning to all inbound and outbound crews.

  Kind regards,
  Operations, Northline Air, ZZQA
