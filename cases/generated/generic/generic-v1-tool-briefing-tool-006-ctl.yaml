  Subject: Freezing fog at ZZQC this evening

  Dear all,

  Freezing fog has set in over ZZQC. Visibility is 300 metres with the sky obscured at 200 feet, and the temperature is minus 4. Some improvement to 800 metres is likely later.

  The wind is calm and pressure is QNH 1024.

  Kind regards,
  Duty Forecaster, ZZQC Met Office
