  Subject: Mist forming at ZZQC, 17th

  Morning all,

  After a clear start, mist has formed over ZZQC and visibility is down to 3000 metres with a few clouds at 200 feet. Expect 1500 metres shortly.

  The wind is calm and pressure is QNH 1018.

  Kind regards,
  Duty Forecaster, ZZQC Met Office
