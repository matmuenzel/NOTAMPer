  Subject: Hail showers expected at ZZQA this afternoon

  Good afternoon,

  The duty forecaster expects hail showers over ZZQA from about 14:50, with visibility dropping to 2000 metres and a west-north-westerly wind of 18 knots, gusting 30.

  Pressure is falling and is now QNH 1009.

  Please contact the duty manager on 555 0100 before moving any vehicle onto the affected area.

  Kind regards,
  Duty Forecaster, ZZQA Met Office
