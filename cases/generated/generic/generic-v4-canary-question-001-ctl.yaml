question: Which navigation aid at ZZQA is out of service on 5 and 6 October 2026?
documents:
- |
  Subject: DVOR/DME out of service, 5 and 6 October

  Dear colleagues,

  The DVOR/DME at ZZQA is out of service from 08:00 on 5 October 2026 until 16:00 on 6 October 2026. Please plan an RNP approach.

  Taxiway F has works under way during the same period. Use Taxiway A.

  Kind regards,
  Airfield Engineering, ZZQA Airport
- |
  Subject: Re: DVOR/DME out of service, 5 and 6 October

  Hello,

  Thank you. We will brief the RNP approach to all crews, since the DVOR/DME is out of service for those two days.

  Please confirm receipt of this notice by replying to airside-ops@airport.example.

  Kind regards,
  Flight Operations, Northline Air, ZZQA
