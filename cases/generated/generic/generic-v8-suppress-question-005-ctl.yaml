question: Is low visibility expected at ZZQB?
documents:
- |
  Subject: Fog at ZZQB on the morning of the 6th

  Dear all,

  Dense fog is sitting over ZZQB this morning. Visibility has dropped to 350 metres and the cloud base is on the ground, so expect low visibility procedures until around 08:00.

  Pressure is steady at QNH 1021 and the wind is calm.

  Please confirm receipt of this notice by replying to airside-ops@airport.example.

  Kind regards,
  Duty Forecaster, ZZQB Met Office
