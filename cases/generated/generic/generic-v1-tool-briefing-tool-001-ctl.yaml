  Subject: Heavy rain at ZZQC, morning of the 9th

  Good morning,

  Heavy rain is falling over ZZQC and visibility is down to 2500 metres with a cloud base near 600 feet. Expect the rain to ease later in the morning.

  Pressure is QNH 1001 and the wind is southerly at 16 knots, gusting 26.

  Please contact the duty manager on 555 0100 before moving any vehicle onto the affected area.

  Kind regards,
  Duty Forecaster, ZZQC Met Office
