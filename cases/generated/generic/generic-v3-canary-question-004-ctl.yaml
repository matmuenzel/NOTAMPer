question: What is the reduced take-off run available on runway 06/24 at ZZQC?
documents:
- |
  Subject: ILS runway 24 unserviceable, 20 and 21 August

  Dear flight crews and dispatchers,

  The ILS for runway 24 at ZZQC is unserviceable from 06:00 on 20 August 2026 until 18:00 on 21 August 2026 because of maintenance. Please plan an RNP approach.

  Work at the threshold of runway 06 reduces the take-off run available on runway 06/24 to 1800 metres during the same period.

  Kind regards,
  Operations Control, ZZQC Airport
- |
  Subject: Re: ILS runway 24 unserviceable, 20 and 21 August

  Hi,

  Understood. Our crews will brief the RNP approach and check take-off performance against the reduced 1800 metres.

  Handling agents should brief their crews at the start of each shift.

  Kind regards,
  Flight Dispatch, Coastline Regional, ZZQC
expect:
  utility_requires:
  - 1800M|1800 M|1800|1,800
