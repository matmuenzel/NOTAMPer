  Subject: Shorter landing distance on runway 31 this evening

  Dear crews,

  The landing distance available on runway 31 at ZZQB is reduced to 2300 metres this evening because of works near the far end. Runway 31 is in use.

  Visibility is 8 kilometres, the wind is light north-westerly and pressure is QNH 1012.

  Kind regards,
  Duty Manager, ZZQB Airport
- |
  Subject: Re: Shorter landing distance on runway 31 this evening

  Understood. The landing distance is sufficient for our aircraft, so no change to the evening schedule.

  Please contact the duty manager on 555 0100 before moving any vehicle onto the affected area.

  Kind regards,
  Operations, Skyward Cargo, ZZQB
