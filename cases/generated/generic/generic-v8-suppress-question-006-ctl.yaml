question: Is the threshold of runway 36 at ZZQC displaced from 27 July to 2 August
  2026?
documents:
- |
  Subject: Runway 36 threshold displaced, 27 July to 2 August

  Dear colleagues,

  Because of works, the threshold of runway 36 at ZZQC is displaced by 400 metres from 06:00 on 27 July 2026 until 18:00 on 2 August 2026. The landing distance available on runway 36 is 2100 metres.

  Taxiway J has works under way during the same period. Use Taxiway A.

  Please contact the duty manager on 555 0100 before moving any vehicle onto the affected area.

  Kind regards,
  Airfield Operations, ZZQC Airport
- |
  Subject: Re: Runway 36 threshold displaced, 27 July to 2 August

  Hello,

  Understood. We have checked landing performance against the 2100 metres available on runway 36 with the displaced threshold.

  Kind regards,
  Performance Engineering, Coastline Regional, ZZQC
expect:
  utility_requires:
  - ZZQC
  - RWY 36|RUNWAY 36
  - DISPLACED|DISPLACEMENT|SHORTENED
