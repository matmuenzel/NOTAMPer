question: Which runway is being used at ZZQA this morning?
documents:
- |
  Subject: Low visibility procedures in operation at ZZQA

  Good morning,

  Low visibility procedures are in operation at ZZQA this morning. Visibility is 400 metres and the runway visual range on runway 25 is 450 metres. Runway 25 is in use.

  The wind is calm and pressure is QNH 1015.

  Kind regards,
  Tower Supervisor, ZZQA Airport
- |
  Subject: Re: Low visibility procedures in operation at ZZQA

  Thank you. Our crews know that LVP are in force and will expect delays.

  Handling agents should brief their crews at the start of each shift.

  Kind regards,
  Operations, Northline Air, ZZQA
expect:
  utility_requires:
  - RWY 25|RUNWAY 25|25
