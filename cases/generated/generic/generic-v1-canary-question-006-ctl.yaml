  Subject: Runway 07R/25L closed this afternoon

  Hello all,

  Runway 07R/25L at ZZQA is closed this afternoon for work in progress. All traffic is using runway 25R with ILS approaches.

  Taxi via Taxiway A and take care on Taxiway B. Pressure is QNH 1013.

  Kind regards,
  Tower Supervisor, ZZQA Airport
